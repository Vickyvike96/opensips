####### Routing Logic ########

loadmodule "topology_hiding.so"
# main request routing logic

route{

	xlog("******INITIAL: $si ************SIP Method: $rm********\n");
	
	if (!mf_process_maxfwd_header(10)) {
		sl_send_reply(483,"Too Many Hops");
		exit;
	}

	if (has_totag()) {
		# sequential requests within a dialog should
		# take the path determined by record-routing
		if (loose_route()) {
			if (is_method("BYE")) {
				# do accunting, even if the transaction fails
				do_accounting("log","failed");
			} else if (is_method("INVITE")) {
				# even if in most of the cases is useless, do RR for
				# re-INVITEs alos, as some buggy clients do change route set
				# during the dialog.
				record_route();
			}
	
			# route it out to whatever destination was set by loose_route()
			# in $du (destination URI).
			route(relay);
		} else {
			
			if ( is_method("ACK") ) {
				#xlog("******ACK FROM: $si********\n"); 
				if ( t_check_trans() ) {
					# non loose-route, but stateful ACK; must be an ACK after 
					# a 487 or e.g. 404 from upstream server
					t_relay();
					exit;
				} else {
					# ACK without matching transaction ->
					# ignore and discard
					exit;
				}
			}

			if (is_method("BYE")) {
				# do accunting, even if the transaction fails
				xlog("******BYE FROM: $si********\n");
				if ($si == "10.200.10.51") {
					$du = "sip:10.200.10.50:5060";
					route(relay);
					exit;
				}else{
					route(relay);
				}
			}
			sl_send_reply(404,"Not here");
		}
		exit;
	}

	# CANCEL processing
	if (is_method("CANCEL"))
	{
		if (t_check_trans())
			t_relay();
		exit;
	}

	if (is_method("BYE")) {
		xlog("******WITHOUT TO TAG BYE FROM: $si********\n");                         
		# do accunting, even if the transaction fails
		if ($si == "10.200.10.51") {
			$du = "sip:10.200.10.50:5060";
			route(relay);
			exit;
		}else{
			route(relay);
		}
	}

	t_check_trans();

	# preloaded route checking
	if (loose_route()) {
		xlog("L_ERR","Attempt to route with preloaded Route's [$fu/$tu/$ru/$ci]");
		if (!is_method("ACK"))
			sl_send_reply(403,"Preload Route denied");
		exit;
	}

	##Options request handling
	if (is_method("OPTIONS")) 
	{
			xlog("**********OPTIONS FROM: $si*********\n");
			options_reply();
	}

	if ($rU==NULL) {
		# request with no Username in RURI
		sl_send_reply(484,"AMIT Address Incomplete");
		exit;
	}

	# account only INVITEs
	if (is_method("INVITE")) {
		xlog("****AMIT******[$ci]INVITE BUFFER=$mb\n");
		do_accounting("log");
		#check if this is from any of our IPs Amit
		if($si =~ "^10\.200\.30\..*" || $si =~ "^10\.200\.10\.50$" || $si =~ "^10\.66\.6\.9$")
		{
			route(outbound);
		}
		else
		{
			route(incoming);
		}     
	}
}

#Route Outbound calls


#Relay Route
route[relay] {

    if ($rd == "10.200.10.50") {
        force_send_socket("udp:10.200.10.51:5060");
    }
    append_hf("X-DateTime: $Ts\r\n");

t_relay();
    if (!t_relay()) {
        send_reply(500,"Internal Error");
    }
    exit;
}


route[incoming] { 
	record_route(); 
#topology_hiding(); 
	rtpengine_offer("replace-origin replace-session-connection ICE=remove DTLS=off RTP/AVP transcode-PCMU codec-strip-opus"); 
	xlog("************RU :::: $rU \n");
        $avp(clean_num) = $(rU{s.select,0,;});
	$ru = "sip:" + $avp(clean_num) + "@10.200.10.50:5060"; 
	t_on_reply("rtp_reply"); 
	if (!t_relay()) { 
	send_reply(500, "Internal Error"); 
	} exit; 
}


route[outbound] {
	record_route();
    $avp(auth_user) = "919010011634";
    $avp(auth_pass) = "jvhKFsQh4Uf3uVuV0PhlzUVktJnWB6CS";
    $avp(auth_realm) = "wa.meta.vc";

    $var(username) = '+' + $tU;
    $var(requestURI) = "sip:" + $var(username) + "@wa.meta.vc;transport=tls";

