failure_route[AUTH_FAILURE] {

    if (t_check_status("407")) {

        xlog("407 received — generating auth\n");

        if (uac_auth()) {

            xlog("Auth header generated, retrying INVITE\n");

            # 🔥 MUST SET AGAIN
            $du = "sip:wa.meta.vc:5061;transport=tls";
            force_send_socket("tls:10.200.10.51:5061");

            t_relay();
            exit;
        }
    }
}


onreply_route[rtp_reply] {

    if (has_body("application/sdp")) {
	  rtpengine_answer("replace-origin replace-session-connection ICE=force DTLS=active RTP/SAVPF");    
}
}


onreply_route[meta_out_reply] {

    if (has_body("application/sdp")) {

        if (!rtpengine_answer(
            "replace-origin replace-session-connection"
        )) {
            xlog("L_ERR", "RTP Answer failed\n");
        }
    }
}




